<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f7f8"><title>Pitlane</title><style>:root{--bg:#f7f7f8;--card:#fff;--fg:#0b0d12;--mu:#6b7280;--mu2:#9aa0aa;--bd:#e7e8ec;--soft:#f2f3f5;--ac:#0b0d12;
--ok:#067647;--okb:#ecfdf3;--re:#b54708;--reb:#fffaeb;--cs:#175cd3;--csb:#eff8ff;--go:#475467;--gob:#f2f4f7;--rd:#b42318}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px;text-decoration-color:#c9ccd3}button{font:inherit;color:inherit;cursor:pointer}
/* sync: one slim, always-visible bar */
.syncbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px;min-height:38px;font-size:13px;font-weight:500;border-bottom:1px solid;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.syncbar .msg{min-width:0;overflow:hidden;text-overflow:ellipsis}.syncbar .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.syncbar button{flex:none;font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;border:0;color:#fff;min-height:28px}
.syncbar.green{background:#ecfdf3f2;border-color:#abefc6;color:#067647}.syncbar.green button{background:#067647}
.syncbar.blue{background:#eff8fff2;border-color:#b2ddff;color:#175cd3}.syncbar.blue button{background:#175cd3}
.syncbar.amber{background:#fffaebf2;border-color:#fedf89;color:#b54708}.syncbar.amber button{background:#b54708}
.syncbar.red{background:#fef3f2f2;border-color:#fecdca;color:#b42318}.syncbar.red button{background:#b42318}
.syncbar.pulse .dot{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.25;transform:scale(1.6)}}
/* layout */
main{max-width:760px;margin:0 auto;padding:0 18px}
.hero{min-height:calc(100vh - 38px);min-height:calc(100dvh - 38px);display:flex;flex-direction:column;justify-content:center;padding:40px 0 12vh}
.mark{font-weight:700;letter-spacing:-.03em;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.18em;margin:0 0 14px}
.hero h1{font-size:clamp(28px,5vw,40px);line-height:1.1;letter-spacing:-.035em;margin:0 0 22px;font-weight:650}
body.chat .hero{display:none}
.ask{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:7px 7px 7px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 28px rgba(16,24,40,.07);transition:box-shadow .15s,border-color .15s}
.ask:focus-within{border-color:#c8ccd4;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 34px rgba(16,24,40,.11)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:17px;padding:10px 0}
.ask input::placeholder{color:var(--mu2)}
.go{flex:none;width:42px;height:42px;border-radius:13px;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:18px}
.clr{flex:none;border:0;background:none;color:var(--mu);font-size:13px;padding:6px 8px;border-radius:10px}.clr:hover{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;color:#344054}.chips button:hover{border-color:#cfd3da;background:#fff}
.meta{color:var(--mu2);font-size:12.5px;margin-top:18px}
/* chat */
#thread{padding:22px 0 140px}body:not(.chat) #thread{display:none}
.dock{display:none}body.chat .dock{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(247,247,248,0))}
.dock .ask{max-width:724px;margin:0 auto}
.u{display:flex;justify-content:flex-end;margin:26px 0 12px}.u span{background:var(--ac);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 15px;max-width:80%;font-weight:500}
.a .say{color:#344054;margin:0 0 12px 2px}.a .say b{color:var(--fg)}
.grp{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px 12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.card.off{background:#fbfbfc}.card.off .ttl{color:#475467}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ttl{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.3;margin:0}
.where{color:var(--mu);font-size:13.5px;margin:3px 0 0}.where b{color:#344054;font-weight:600}
.badge{flex:none;font-size:11.5px;font-weight:650;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-available{background:var(--okb);color:var(--ok)}.b-reserved{background:var(--reb);color:var(--re)}.b-soon{background:var(--csb);color:var(--cs)}
.b-sold,.b-gone{background:#1f2937;color:#fff}.b-want{background:#f4f3ff;color:#5925dc}.b-post{background:var(--gob);color:var(--go)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;margin:14px 0 4px;padding:12px 0 0;border-top:1px solid var(--soft)}
.facts div{min-width:0}.facts dt{font-size:11px;color:var(--mu2);text-transform:uppercase;letter-spacing:.07em;margin:0}.facts dd{margin:1px 0 0;font-weight:550;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts dd.na{color:var(--mu2);font-weight:400}
.note{color:var(--mu);font-size:13.5px;margin:8px 0 0}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.wb span{font-size:12.5px;background:#f4f3ff;color:#5925dc;border-radius:999px;padding:3px 10px}
.ft{display:flex;align-items:center;gap:4px;margin:10px -6px 0;flex-wrap:wrap}.ft a,.ft button{font-size:13px;color:var(--mu);border:0;background:none;padding:5px 7px;border-radius:8px;text-decoration:none}
.ft a:hover,.ft button:hover{background:var(--soft);color:var(--fg)}.ft .sp{flex:1}.ft .del:hover{color:var(--rd);background:#fef3f2}
.more{border:1px dashed var(--bd);background:none;border-radius:14px;width:100%;padding:10px;color:#344054;font-size:14px}
.empty{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}.empty p{margin:0 0 10px;color:#344054}.empty .chips{margin:0}
.socials{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:10px 0 0;color:var(--mu)}
.card textarea{width:100%;min-height:64px;border:1px solid var(--bd);border-radius:12px;padding:9px 11px;font:inherit;font-size:14px;resize:vertical;margin-top:12px;background:#fcfcfd}
/* inline edit */
form.edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 2px}
form.edit label{display:flex;flex-direction:column;font-size:11px;color:var(--mu2);text-transform:uppercase;letter-spacing:.06em;min-width:0}
form.edit .w2{grid-column:span 2}form.edit .w4{grid-column:1/-1}
form.edit input,form.edit select,form.edit textarea{font:inherit;font-size:14.5px;color:var(--fg);text-transform:none;letter-spacing:0;margin-top:3px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff;min-width:0;width:100%}
form.edit textarea{min-height:60px;resize:vertical;margin-top:3px}
form.edit input:focus,form.edit select:focus,form.edit textarea:focus{outline:0;border-color:#98a2b3;box-shadow:0 0 0 3px #f2f4f7}
.acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600;min-height:40px}.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.danger{background:#d92d20;color:#fff;border-color:#d92d20}.btn.danger:hover{background:#b42318}
/* modal + toast (unchanged behaviour) */
#modal{display:none}#modal.open{display:block;position:fixed;inset:0;z-index:100}
.mback{position:absolute;inset:0;background:rgba(16,24,40,.35);backdrop-filter:blur(3px);animation:fd .15s}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));background:#fff;border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(16,24,40,.25);animation:pop .16s ease-out}
.mbox h3{margin:0 0 6px;font-size:17px;line-height:1.3}.mbox p{margin:0 0 18px;color:#667085;font-size:14px}
.mbtns{display:flex;gap:10px;justify-content:flex-end}.mbtns .btn{min-height:44px;padding:0 20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none;gap:14px;align-items:center;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:#93c5fd;font-weight:650}
@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
@media(max-width:640px){main{padding:0 14px}.facts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}.facts dd{font-size:14px}form.edit{grid-template-columns:repeat(2,minmax(0,1fr))}form.edit .w2{grid-column:1/-1}
 .ask input{font-size:16px}.card{padding:14px 15px 10px;border-radius:16px}.ttl{font-size:16px}.syncbar{justify-content:space-between;font-size:12.5px}
 .mbox{top:auto;bottom:16px;transform:translateX(-50%)}.mbtns .btn{flex:1}@keyframes pop{from{opacity:0;transform:translate(-50%,20px)}}
 body.chat .dock{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.hero{padding-bottom:16vh}}
</style></head><body>
