  S.forEach(function(r){if(r.dealer!==a.name||(r.status!=='Available'&&r.status!=='Reserved'))return;var t=(r.make+' '+r.model).toLowerCase();
   var k=kw.filter(function(k){return t.indexOf(k.toLowerCase())>=0}).sort(function(x,y){return y.length-x.length})[0];if(k)out.push({r:r,to:b.name,k:k})})})});return out}
function ed(col,id,f,v,cls){return '<span class="ed '+(cls||'')+'" contenteditable="true" spellcheck="false" data-c="'+col+'" data-i="'+id+'" data-f="'+f+'">'+esc(v)+'</span>'}
function stSel(r){return '<select class="st '+r.status.split(' ')[0]+'" data-c="stock" data-i="'+r.id+'" data-f="status">'+['Available','Reserved','Sold','Coming soon','Gone (not listed)'].map(function(s){return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'}
var COLS=[['year','Year'],['miles','Miles'],['gearbox','Gearbox'],['price','Price'],['status','Status'],['link','Link']];
function table(rows){var c=P.cols;var h='<div class="tw"><table><thead><tr><th data-sort="make">Car</th>'+COLS.filter(function(x){return c[x[0]]}).map(function(x){return '<th class="c-'+x[0]+'"'+(x[0]==='price'||x[0]==='year'?' data-sort="'+x[0]+'"':'')+'>'+x[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>';
 rows.forEach(function(r){h+='<tr class="'+(r.status==='Available'||r.status==='Coming soon'?'':'dim')+'"><td><b>'+ed('stock',r.id,'make',r.make)+' '+ed('stock',r.id,'model',r.model)+'</b>'+(edited('stock',r.id)?'<span class="mark">Edited</span>':'')+'</td>'+
  (c.year?'<td class="num c-year">'+ed('stock',r.id,'year',r.year)+'</td>':'')+(c.miles?'<td class="num c-miles">'+ed('stock',r.id,'miles',r.miles)+'</td>':'')+(c.gearbox?'<td class="c-gearbox">'+ed('stock',r.id,'gearbox',r.gearbox)+'</td>':'')+
  (c.price?'<td class="num c-price">'+ed('stock',r.id,'price',r.price)+'</td>':'')+(c.status?'<td class="c-status">'+stSel(r)+'</td>':'')+(c.link?'<td class="c-link">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">Open ↗</a>':'')+'</td>':'')+
  '<td><button class="x" title="Delete row" data-del="stock" data-i="'+r.id+'">×</button></td></tr>'});
 return h+'</tbody></table></div>'}
function wantsHtml(ws){return ws.map(function(w){return '<div class="want"><b>'+ed('wants',w.id,'car',w.car)+(edited('wants',w.id)?'<span class="mark">Edited</span>':'')+'</b><small>'+ed('wants',w.id,'detail',w.detail)+'</small><small>'+(w.url?'<a href="'+esc(w.url)+'" target="_blank" rel="noopener">Source</a> · ':'')+ed('wants',w.id,'date',w.date)+'</small><button class="x" style="position:absolute;right:0;top:6px" data-del="wants" data-i="'+w.id+'">×</button></div>'}).join('')||'<span class="sm">None yet.</span>'}
function sec(key,title,n,inner,open){var o=P.open[key];if(o===undefined)o=open;return '<details data-k="'+key+'"'+(o?' open':'')+'><summary><span>'+title+'<span class="n">'+n+'</span></span></summary><div class="body">'+inner+'</div></details>'}
function render(){
 document.body.classList.toggle('compact',P.dense);
 var D=list('dealers'),S=list('stock'),W=list('wants'),Q=qcs(),qids=Q.map(function(x){return x.r.id}),q=P.q.toLowerCase();
 var srt=function(a,b){return P.sort==='price'?price(b.price)-price(a.price):P.sort==='year'?(b.year||0)-(a.year||0):(a.make+a.model).localeCompare(b.make+b.model)};
 var match=function(r){return(!q||(r.make+' '+r.model+' '+(r.price||'')).toLowerCase().indexOf(q)>=0)&&(!P.qc||qids.indexOf(r.id)>=0)};
 var h='';
 h+='<div class="glance">'+D.map(function(d){var s=S.filter(function(r){return r.dealer===d.name});return '<div class="stat"><b>'+esc(d.name)+'</b><span>'+s.filter(function(r){return r.status==='Available'}).length+' live · '+s.filter(function(r){return r.status==='Reserved'}).length+' reserved · '+s.filter(function(r){return SOLD(r.status)}).length+' sold/gone · '+W.filter(function(w){return w.dealer===d.name&&w.type==='wants_to_buy'}).length+' wants</span></div>'}).join('')+'</div>';
 h+=sec('qc','Quick connect',Q.length,Q.map(function(x){var r=x.r;return '<div class="qc"><span><b>'+esc(r.year+' '+r.make+' '+r.model)+'</b> <span class="sm" style="display:inline">'+esc(r.price)+'</span> <span class="st '+r.status+'">'+r.status+'</span><span class="sm">'+esc(r.dealer)+' sells → '+esc(x.to)+' wants “'+esc(x.k)+'”</span></span>'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">Open ↗</a>':'')+'</div>'}).join('')||'<span class="sm">No overlaps right now.</span>',true);
 D.forEach(function(d){if(P.dealer!=='all'&&P.dealer!==d.name)return;var mine=S.filter(function(r){return r.dealer===d.name&&match(r)}).sort(srt);
  var sell=mine.filter(function(r){return r.status==='Available'||(P.sold&&r.status==='Reserved')}),soon=mine.filter(function(r){return r.status==='Coming soon'}),gone=mine.filter(function(r){return SOLD(r.status)});
  var ws=W.filter(function(w){return w.dealer===d.name&&w.type==='wants_to_buy'}),wsoon=W.filter(function(w){return w.dealer===d.name&&w.type==='coming_soon'}),wsold=W.filter(function(w){return w.dealer===d.name&&w.type==='sold_post'});
  var k=d.id,inner='<p class="cap" style="margin:0 0 6px">'+ed('dealers',d.id,'town',d.town)+' · '+ed('dealers',d.id,'note',d.note)+' · <a href="'+esc(d.web)+'" target="_blank" rel="noopener">Website</a> · <a href="'+esc(d.sell)+'" target="_blank" rel="noopener">Sell page</a></p>';
  if(P.view!=='wants')inner+=sec(k+'-sell','Selling',sell.length,table(sell)+'<button class="btn ghost" data-add="stock" data-d="'+esc(d.name)+'" data-s="Available">+ Add car</button>',true)+
    sec(k+'-soon','Coming soon',soon.length+wsoon.length,(soon.length?table(soon):'')+wantsHtml(wsoon)+'<button class="btn ghost" data-add="stock" data-d="'+esc(d.name)+'" data-s="Coming soon">+ Add coming-soon car</button>',soon.length+wsoon.length>0);
  if(P.view!=='selling')inner+=sec(k+'-wants','Wants to buy',ws.length,wantsHtml(ws)+'<button class="btn ghost" data-add="wants" data-d="'+esc(d.name)+'">+ Add want</button>',true);
  if(P.sold&&P.view!=='wants')inner+=sec(k+'-sold','Sold / gone',gone.length+wsold.length,(gone.length?table(gone):'')+wantsHtml(wsold),false);
  inner+=sec(k+'-src','Sources',d.socials.length,d.socials.map(function(s){return '<div class="sm">'+(s[2]?'✓':'✗')+' <a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>'+(s[2]?'':' — needs login, not read')+'</div>'}).join(''),false);
  inner+=sec(k+'-notes','Notes',(E.notes[d.name]||'')?'•':'','<textarea data-note="'+esc(d.name)+'" placeholder="Notes about '+esc(d.name)+'…">'+esc(E.notes[d.name]||'')+'</textarea>',false);
  h+='<details class="dealer" data-k="'+k+'"'+(P.open[k]===false?'':' open')+'><summary><span><h2 style="display:inline">'+ed('dealers',d.id,'label',d.label||d.name)+'</h2><span class="n">'+sell.length+' selling · '+ws.length+' wants</span></span></summary><div class="body">'+inner+'</div></details>'});
 document.getElementById('app').innerHTML=h;
 document.getElementById('edited').classList.toggle('hide',!anyEdits());
 bar();}
function pills(name,opts){return '<span class="pills">'+opts.map(function(o){return '<button data-p="'+name+'" data-v="'+esc(o[0])+'" class="'+(String(P[name])===String(o[0])?'on':'')+'">'+esc(o[1])+'</button>'}).join('')+'</span>'}
function sw(name,label){return '<button class="sw'+(P[name]?' on':'')+'" data-sw="'+name+'"><i></i>'+label+'</button>'}
function bar(){var D=list('dealers');document.getElementById('bar').innerHTML=
 '<input class="s" id="q" type="search" placeholder="Search cars…" value="'+esc(P.q)+'">'+pills('view',[['both','Both'],['selling','Selling'],['wants','Wants']])+pills('dealer',[['all','All dealers']].concat(D.map(function(d){return[d.name,d.name]})))+
 sw('sold','Sold & reserved')+sw('qc','Quick-connect only')+sw('dense','Compact')+
 '<select id="sort"><option value="make"'+(P.sort==='make'?' selected':'')+'>Sort: make</option><option value="price"'+(P.sort==='price'?' selected':'')+'>Sort: price</option><option value="year"'+(P.sort==='year'?' selected':'')+'>Sort: year</option></select>'+
 '<span class="colmenu" id="cm"><button class="btn" id="cmb">Columns</button><span class="m">'+COLS.map(function(c){return '<label><input type="checkbox" data-col="'+c[0]+'"'+(P.cols[c[0]]?' checked':'')+'> '+c[1]+'</label>'}).join('')+'</span></span>'+
 '<button class="btn ghost" id="xa">Expand all</button><button class="btn ghost" id="ca">Collapse all</button>';
 var qi=document.getElementById('q');if(window._qf){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}
function toast(msg,fn){var t=document.getElementById('toast');t.innerHTML=esc(msg)+(fn?' <button id="und">Undo</button>':'');t.style.display='flex';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},5000);undo=fn}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}
function csv(rows,f){return [f.join(',')].concat(rows.map(function(r){return f.map(function(k){var v=String(r[k]==null?'':r[k]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')})).join('\n')}
document.addEventListener('click',function(e){var t=e.target.closest('button,[data-sort]');if(!t)return;
 if(t.dataset.p){P[t.dataset.p]=t.dataset.v;saveP();render()}
 else if(t.dataset.sw){P[t.dataset.sw]=!P[t.dataset.sw];saveP();render()}
 else if(t.dataset.sort){P.sort=t.dataset.sort;saveP();render()}
 else if(t.id==='cmb'){document.getElementById('cm').classList.toggle('open')}
 else if(t.id==='xa'||t.id==='ca'){document.querySelectorAll('details').forEach(function(d){d.open=t.id==='xa';P.open[d.dataset.k]=d.open});saveP()}
 else if(t.dataset.del){var c=t.dataset.del,id=t.dataset.i,r=find(c,id);E.deleted.push(id);save();render();toast('Row deleted',function(){E.deleted=E.deleted.filter(function(x){return x!==id});save();render()})}
 else if(t.dataset.add){var c=t.dataset.add,id='new-'+Date.now()+'-'+(seq++),r=c==='stock'?{id:id,dealer:t.dataset.d,make:'Make',model:'Model',year:'',miles:'',price:'',gearbox:'',status:t.dataset.s,url:''}:{id:id,dealer:t.dataset.d,type:'wants_to_buy',car:'Car wanted',detail:'Detail',url:'',date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};E[c][id]=r;save();render();toast('Row added — click any field to edit')}
 else if(t.id==='und'&&undo){undo();undo=null;document.getElementById('toast').style.display='none'}
 else if(t.id==='exp'){dl('dealer-stock.csv',csv(list('stock'),['dealer','make','model','year','miles','price','gearbox','status','url']),'text/csv');setTimeout(function(){dl('dealer-wants.csv',csv(list('wants'),['dealer','type','car','detail','url','date']),'text/csv')},300)}
 else if(t.id==='expj'){dl('overrides.json',JSON.stringify(E,null,1),'application/json')}
 else if(t.id==='rst'){if(confirm('Discard all edits in this browser and reload the latest data?')){localStorage.removeItem(KEY);E={stock:{},wants:{},dealers:{},notes:{},deleted:[]};render()}}
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.k){P.open[d.dataset.k]=d.open;saveP()}},true);
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.col){P.cols[t.dataset.col]=t.checked?1:0;saveP();render();document.getElementById('cm').classList.add('open')}
 else if(t.id==='sort'){P.sort=t.value;saveP();render()} else if(t.dataset.f){set(t.dataset.c,t.dataset.i,t.dataset.f,t.value)}});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='q'){P.q=t.value;saveP();window._qf=1;clearTimeout(window._qt);window._qt=setTimeout(function(){render();},120)}
 else if(t.dataset.note!=null){E.notes[t.dataset.note]=t.value;if(!t.value)delete E.notes[t.dataset.note];save();document.getElementById('edited').classList.toggle('hide',!anyEdits())}});
document.addEventListener('focusout',function(e){var t=e.target;if(t.classList&&t.classList.contains('ed'))set(t.dataset.c,t.dataset.i,t.dataset.f,t.textContent.trim());if(t.id==='q')window._qf=0});
document.addEventListener('keydown',function(e){if(e.target.classList&&e.target.classList.contains('ed')&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.addEventListener('click',function(e){if(e.target.closest('summary .ed'))e.preventDefault()},true);
render();
})();
</script></body></html>
